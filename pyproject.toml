[project]
name = "drowsiness-detection"
version = "0.2.0"
description = "Real-time driver drowsiness detection using MediaPipe face mesh, multi-signal fusion scoring, and a Streamlit analytics dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe==0.10.14",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.90",
    "pandas>=2.3.0",
    "plotly>=6.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.45.0",
]
